name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate v-prefixed SemVer tags
        id: tag
        run: python3 scripts/ci/release.py metadata
      - name: Require release commits to belong to master
        if: steps.tag.outputs.release == 'true'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  rust:
    runs-on: ubuntu-latest
    # Recent GTK/Libadwaita; Ubuntu 24.04's Libadwaita is too old.
    container: fedora:43
    steps:
      - name: Install native dependencies
        run: dnf install -y gcc git curl-minimal tar pkgconf-pkg-config gtk4-devel libadwaita-devel gtksourceview5-devel webkitgtk6.0-devel gstreamer1-plugins-base gstreamer1-plugins-good jq xorg-x11-server-Xvfb xdotool dbus-daemon mesa-dri-drivers
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --workspace --locked
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: GTK smoke test
        env:
          DISPLAY: ':99'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GIO_USE_VFS: local
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          # The CI container cannot create nested user namespaces. This exception
          # is only for trusted test fixtures, never application configuration.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          sleep 2
          dbus-run-session -- cargo test -p ravel-desktop --locked -- --ignored

  arch-package:
    needs: [rust, release-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    env:
      CARGO_BUILD_JOBS: '2'
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed git rust python jq shellcheck actionlint openssh desktop-file-utils
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check publishing automation without AUR credentials
        run: |
          actionlint
          shellcheck scripts/ci/*.sh
          bash scripts/ci/test-publish-aur.sh
          bash scripts/ci/test-run-arch-build.sh
          bash scripts/ci/test-publish-bin.sh
          python3 scripts/ci/test_release.py
          python3 scripts/ci/test_publish_release.py
      - name: Build and check the tested commit as an Arch package
        run: bash scripts/ci/run-arch-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ravel-git-arch-${{ github.sha }}
          path: ${{ runner.temp }}/ravel-package/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: needs.release-tag.outputs.release == 'true'
        with:
          name: ravel-release-${{ github.sha }}
          path: ${{ runner.temp }}/ravel-package/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [release-tag, rust, arch-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release-tag.outputs.release == 'true' && github.repository == 'ReadyPlayerNaN/ravel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ravel-github-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ravel-release-${{ github.sha }}
          path: release-files
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: bash scripts/ci/publish-release.sh release-files

  publish-aur-bin:
    needs: [release-tag, release]
    if: needs.release-tag.outputs.prerelease == 'false' && github.repository == 'ReadyPlayerNaN/ravel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aur
    concurrency:
      group: aur-ravel-bin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ravel-release-${{ github.sha }}
          path: release-files
      - name: Publish the stable binary recipe
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_COMMIT_NAME: ${{ vars.AUR_COMMIT_NAME }}
          AUR_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
        run: bash scripts/ci/publish-aur.sh ravel-bin release-files/aur

  publish-aur:
    needs: [rust, arch-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'ReadyPlayerNaN/ravel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aur
    concurrency:
      group: aur-ravel-git
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Skip superseded master builds
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/master | cut -f1)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer master commit exists; skipping this publication.'
          fi
      - name: Publish the validated AUR recipe
        if: steps.current.outputs.publish == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_COMMIT_NAME: ${{ vars.AUR_COMMIT_NAME }}
          AUR_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
        run: bash scripts/ci/publish-aur.sh
